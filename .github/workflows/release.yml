# .github/workflows/release.yml
#
# Triggered by pushing an annotated tag like ``v0.2.0``. Builds the wheel and
# sdist and attaches them to a GitHub Release.
#
# This project is deliberately NOT published to PyPI — it is installed from the
# repo with ``uv tool install``. A PyPI job used to live here, dormant behind a
# ``vars.PYPI_ENABLED`` flag; it was removed so that setting up Trusted
# Publishing some day cannot silently start publishing.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write        # required to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for auto-generated notes

      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  github_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Idempotent on purpose: if the release was already created by hand (or
      # the workflow is re-run), update it instead of failing the whole run.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
